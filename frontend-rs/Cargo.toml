[package]
name = "frontend-rs"
version = "0.1.0"
edition = "2021"
description = "MyCloud web frontend, rewritten in Rust (Yew/WASM)"

[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures-channel = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "Headers",
  "Request",
  "RequestInit",
  "RequestCredentials",
  "Response",
  "Blob",
  "File",
  "FileList",
  "FileReader",
  "ProgressEvent",
  "DragEvent",
  "DataTransfer",
  "KeyboardEvent",
  "MouseEvent",
  "Storage",
  "MediaQueryList",
  "SubmitEvent",
  "Navigator",
  "Clipboard",
] }
